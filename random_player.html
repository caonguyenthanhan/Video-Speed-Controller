<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Video Player</title>
    <style>
        body {
            background-color: #000;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            overflow: hidden;
        }
        .player-wrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain; /* Ép viền sát mép */
            outline: none;
        }
        
        /* Thanh điều khiển nổi ở trên cùng */
        .floating-controls {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(20, 20, 20, 0.85);
            backdrop-filter: blur(10px);
            padding: 10px 20px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 15px;
            z-index: 99999;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            border: 1px solid rgba(255,255,255,0.1);
            transition: opacity 0.3s ease;
            white-space: nowrap;
        }
        .floating-controls:hover {
            opacity: 1 !important;
        }
        
        /* Chia nhóm các nút */
        .control-group {
            display: flex;
            align-items: center;
            gap: 8px;
            padding-right: 15px;
            border-right: 1px solid rgba(255,255,255,0.2);
        }
        .control-group:last-child {
            border-right: none;
            padding-right: 0;
        }

        button {
            padding: 8px 15px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
        }
        button:hover { background-color: #0056b3; transform: translateY(-1px); }
        button:active { transform: translateY(1px); }
        
        #randomBtn { background-color: #28a745; display: none; }
        #randomBtn:hover { background-color: #218838; }

        .speed-btn { background-color: #333; padding: 6px 12px; font-size: 12px; }
        .speed-btn:hover { background-color: #555; }
        
        #fullscreenBtn { background-color: #6f42c1; }
        #fullscreenBtn:hover { background-color: #59339d; }

        input[type="range"] {
            width: 130px;
            cursor: pointer;
            accent-color: #00ffc8;
        }
        #localSpeedDisplay {
            min-width: 45px;
            text-align: center;
            font-weight: bold;
            color: #00ffc8;
            font-size: 14px;
        }

        /* Tên File hiển thị nổi ở góc dưới */
        .floating-file-name {
            position: absolute;
            bottom: 80px; 
            left: 20px;
            background: rgba(0,0,0,0.6);
            padding: 8px 15px;
            border-radius: 8px;
            color: #ddd;
            font-size: 14px;
            pointer-events: none;
            z-index: 99998;
            max-width: 50%;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: opacity 0.3s ease;
        }
    </style>
</head>
<body>
    <div class="player-wrapper" id="playerWrapper">
        <!-- THANH ĐIỀU KHIỂN NỔI (Gộp 3 khối thành 1 hàng) -->
        <div class="floating-controls" id="floatingControls">
            <!-- Khối 1: Thư mục -->
            <div class="control-group">
                <button id="selectFolderBtn">📁 Chọn thư mục</button>
                <button id="randomBtn">🎲 Video Khác</button>
            </div>

            <!-- Khối 2: Tốc độ (Tối đa 16x) -->
            <div class="control-group" id="speedControls" style="display: none;">
                <button class="speed-btn" id="speedDown">-0.25</button>
                <input type="range" id="localSpeedSlider" min="0.1" max="16" step="0.05" value="1">
                <span id="localSpeedDisplay">1.00x</span>
                <button class="speed-btn" id="speedUp">+0.25</button>
                <button class="speed-btn" id="speedReset">1x</button>
            </div>

            <!-- Khối 3: Fullscreen của riêng Wrapper -->
            <div class="control-group" id="utilityControls" style="display: none;">
                <button id="fullscreenBtn">🔲 Toàn màn hình</button>
            </div>
        </div>

        <!-- VIDEO -->
        <!-- Thuộc tính controlsList="nofullscreen" sẽ giấu đi nút Fullscreen gốc của Chrome -->
        <video id="videoPlayer" controls controlsList="nofullscreen" autoplay></video>

        <div id="fileName" class="floating-file-name">Chưa chọn thư mục nào</div>
    </div>

    <script src="random_player.js"></script>
</body>
</html>
