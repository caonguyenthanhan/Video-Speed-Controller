<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Speed Controller</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>Video Speed Controller</h1>
            <div class="shortcuts-toggle" id="shortcutsToggle">⌨️</div>
        </div>

        <!-- Shortcuts Section (Collapsible) -->
        <div class="shortcuts-section" id="shortcutsSection">
            <div class="shortcuts-content">
                <span class="shortcut-text" id="shortcutDisplay">Ctrl+Shift+← / → để điều chỉnh tốc độ</span>
                <div class="additional-shortcuts">
                    <div class="shortcut-item">
                        <span class="shortcut-key">Ctrl+Alt/Shift+↑</span>
                        <span class="shortcut-desc">Reset tốc độ về 1x</span>
                    </div>
                    <div class="shortcut-item">
                        <span class="shortcut-key">Ctrl+Alt/Shift+↓</span>
                        <span class="shortcut-desc">Mở màn hình điều khiển</span>
                    </div>
                </div>
                
                <!-- Shortcut Settings -->
                <div class="shortcut-settings">
                    <div class="setting-group">
                        <label>Chọn phím tắt:</label>
                        <select id="shortcutType" class="shortcut-select">
                            <option value="ctrl+shift">Ctrl+Shift+← / →</option>
                            <option value="ctrl+alt">Ctrl+Alt+← / →</option>
                            <option value="custom">Tự gắn phím</option>
                        </select>
                    </div>
                    
                    <div class="custom-shortcut" id="customShortcut" style="display: none;">
                        <div class="custom-group">
                            <label>Giảm tốc độ:</label>
                            <input type="text" id="customDecrease" placeholder="Nhấn phím..." readonly>
                        </div>
                        <div class="custom-group">
                            <label>Tăng tốc độ:</label>
                            <input type="text" id="customIncrease" placeholder="Nhấn phím..." readonly>
                        </div>
                        <button id="saveCustom" class="save-btn">Lưu</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Main Control -->
        <div class="main-control">
            <div class="speed-display">
                <button class="speed-btn decrease" id="decreaseSpeed">-</button>
                <span id="currentSpeed">1.00x</span>
                <button class="speed-btn increase" id="increaseSpeed">+</button>
            </div>
            
            <div class="slider-container" id="sliderContainer">
                <input type="range" id="speedSlider" min="0" max="16" step="1" value="4" class="speed-slider">
                <div class="slider-marks" id="sliderMarks"></div>
            </div>

            <div class="preset-chips">
                <button class="chip" data-speed="1">1.0x</button>
                <button class="chip" data-speed="1.5">1.5x</button>
                <button class="chip" data-speed="2">2.0x</button>
                <button class="chip" data-speed="3">3.0x</button>
            </div>

            <button id="resetSpeed" class="reset-btn">
                RESET
                <small class="reset-hint">(Ctrl+Alt/Shift+↑)</small>
            </button>
        </div>

        <!-- Status -->
        <div class="status">
            <span id="statusMessage">Sẵn sàng điều khiển video</span>
        </div>
    </div>

    <script src="popup.js"></script>
    <button id="openRandomPlayerBtn" style="width: 100%; margin-top: 15px; padding: 10px; background: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer;">
        🎬 Mở Video Ngẫu Nhiên Trong Máy
    </button>
</body>
</html>
